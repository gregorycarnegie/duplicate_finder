[package]
name = "duplicate_finder"
version = "0.6.0"
description = "Find duplicate and likely-duplicate files, including media matched by duration"
edition = "2024"
license = "MIT"
[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
blake3 = "1.8.7"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
trash = "5.2.9"
walkdir = "2.5.0"

[dev-dependencies]
proptest = "1.11.0"
tauri = { version = "2.12.1", features = ["test"] }
