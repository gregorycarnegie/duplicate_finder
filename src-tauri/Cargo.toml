[package]
name = "duplicate_finder"
version = "0.6.1"
description = "Find duplicate and likely-duplicate files, including media matched by duration"
edition = "2024"
license = "MIT"
[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
blake3 = "1.8.7"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-opener = "2.7.1"
trash = "5.2.9"
walkdir = "2.5.0"

[dev-dependencies]
proptest = "1.12.0"
rstest = { version = "0.27.0", default-features = false }
tauri = { version = "2.12.3", features = ["test"] }
